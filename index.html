<!DOCTYPE html>
<html>
<head>
    <title>Stark Industries - Neural Hub</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .hud { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        /* THE GRID ARCHITECTURE */
        .app-grid { display: grid; grid-template-columns: repeat(4, 100px); gap: 20px; margin-top: 30px; display: none; }
        .app-card { background: #1a1a1a; width: 100px; height: 100px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; border: 1px solid #333; }
        .app-card:hover { background: #252525; border-color: #00d4ff; transform: translateY(-5px); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .app-icon { font-size: 24px; margin-bottom: 8px; }
        .app-label { font-size: 11px; color: #888; font-weight: 500; }

        /* THE VIEWPORT LAYER */
        #gameWindow { display: none; width: 100vw; height: 100vh; border: none; background: #000; position: absolute; top: 0; left: 0; z-index: 999; }
        #closeBtn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: #ff4444; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: none; font-weight: bold; }
        
        /* AUTH SECTION */
        #authSection input { background: transparent; border: 1px solid #333; color: #00d4ff; padding: 12px; text-align: center; border-radius: 8px; outline: none; margin-top: 15px; width: 200px; }
    </style>
</head>
<body>

    <button id="closeBtn" onclick="closeApp()">X CLOSE [ESC]</button>
    <iframe id="gameWindow" src=""></iframe>

    <div class="hud" id="mainHud">
        <h2 id="statusHeader" style="font-weight: 300; letter-spacing: 2px;">STARK INDUSTRIES</h2>
        
        <div id="authSection">
            <p style="color: #555; font-size: 12px;">AUTHORIZATION REQUIRED</p>
            <input type="password" id="passInput" maxlength="4" placeholder="CODE">
        </div>

        <div class="app-grid" id="appGrid">
            <!-- ROW 1 -->
            <div class="app-card" onclick="launch('https://youtube.com')">
                <div class="app-icon">📺</div><div class="app-label">YouTube</div>
            </div>
            <div class="app-card" onclick="launch('https://pages.dev')">
                <div class="app-icon">🎮</div><div class="app-label">Games</div>
            </div>
            <div class="app-card" onclick="launch('https://google.com')">
                <div class="app-icon">🔍</div><div class="app-label">Google</div>
            </div>
            <div class="app-card" onclick="launch('https://discord.com')">
                <div class="app-icon">💬</div><div class="app-label">Discord</div>
            </div>
            <!-- ROW 2 -->
            <div class="app-card" onclick="launch('https://roblox.com')">
                <div class="app-icon">🧱</div><div class="app-label">Roblox</div>
            </div>
            <div class="app-card" onclick="launch('https://githack.com')">
                <div class="app-icon">🛠️</div><div class="app-label">Assets</div>
            </div>
            <div class="app-card" onclick="launch('https://tiktok.com')">
                <div class="app-icon">🎵</div><div class="app-label">TikTok</div>
            </div>
            <div class="app-card" onclick="launch('https://youtube.com')">
                <div class="app-icon">🎵</div><div class="app-label">Music</div>
            </div>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('passInput');
        const gameWindow = document.getElementById('gameWindow');
        const closeBtn = document.getElementById('closeBtn');

        // EXIT PROTECTION
        window.onbeforeunload = () => "Neural Link will be severed.";

        // AUTHENTICATION
        passInput.addEventListener('input', () => {
            if (passInput.value === "3000") {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appGrid').style.display = 'grid';
                document.getElementById('statusHeader').innerText = "NEURAL HUB";
            }
        });

        // STEALTH LAUNCH
        function launch(url) {
            gameWindow.src = url;
            gameWindow.style.display = 'block';
            closeBtn.style.display = 'block';
        }

        function closeApp() {
            gameWindow.src = "about:blank";
            gameWindow.style.display = 'none';
            closeBtn.style.display = 'none';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeApp();
        });
    </script>
</body>
</html>
