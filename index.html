<!DOCTYPE html>
<html>
<head>
    <title>Stark Industries - Neural Hub</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .hud { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .app-grid { display: grid; grid-template-columns: repeat(3, 110px); gap: 20px; margin-top: 30px; display: none; }
        .app-card { background: #1a1a1a; width: 110px; height: 110px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; border: 1px solid #333; }
        .app-card:hover { background: #252525; border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .app-icon { font-size: 28px; margin-bottom: 8px; }
        .app-label { font-size: 11px; color: #888; font-weight: 500; text-transform: uppercase; }
        #authSection input { background: transparent; border: 1px solid #333; color: #00d4ff; padding: 12px; text-align: center; border-radius: 8px; outline: none; margin-top: 15px; width: 220px; }
    </style>
</head>
<body>
    <div class="hud" id="mainHud">
        <h2 id="statusHeader" style="font-weight: 300; letter-spacing: 5px; color: #00d4ff;">STARK INDUSTRIES</h2>
        <div id="authSection">
            <input type="password" id="passInput" maxlength="4" placeholder="CODE">
        </div>
        <div class="app-grid" id="appGrid">
            <!-- THE SECURE VAULT JUMP -->
            <div class="app-card" onclick="window.location.href='https://github.io'">
                <div class="app-icon">🎮</div><div class="app-label">Games</div>
            </div>
            <div class="app-card" onclick="window.location.href='https://google.com'">
                <div class="app-icon">🔍</div><div class="app-label">Google</div>
            </div>
            <div class="app-card" onclick="window.location.href='https://youtube.com'">
                <div class="app-icon">📺</div><div class="app-label">YouTube</div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('passInput').addEventListener('input', (e) => {
            if (e.target.value === "3000") {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appGrid').style.display = 'grid';
                document.getElementById('statusHeader').innerText = "SYSTEM ACTIVE";
            }
        });
    </script>
</body>
</html>
