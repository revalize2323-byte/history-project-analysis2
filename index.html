<!DOCTYPE html>
<html>
<head>
    <title>Stark Industries - Neural Hub</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .hud { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        /* THE GRID ARCHITECTURE */
        .app-grid { display: grid; grid-template-columns: repeat(3, 110px); gap: 20px; margin-top: 30px; display: none; }
        .app-card { background: #1a1a1a; width: 110px; height: 110px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; border: 1px solid #333; }
        .app-card:hover { background: #252525; border-color: #00d4ff; transform: scale(1.05); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .app-icon { font-size: 28px; margin-bottom: 8px; }
        .app-label { font-size: 11px; color: #888; font-weight: 500; text-transform: uppercase; }

        /* AUTH SECTION */
        #authSection input { background: transparent; border: 1px solid #333; color: #00d4ff; padding: 12px; text-align: center; border-radius: 8px; outline: none; margin-top: 15px; width: 220px; font-family: 'Consolas', monospace; }
        
        /* THEATER VIEWPORT (For Google/YT) */
        #viewport { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background: #000; z-index: 999; }
        iframe { width: 100%; height: 100%; border: none; }
        #escHint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #004455; font-size: 10px; z-index: 1000; }
    </style>
</head>
<body>

    <!-- THEATER LAYER -->
    <div id="viewport">
        <iframe id="frame" src=""></iframe>
        <div id="escHint">PRESS [ESC] TO DISCONNECT</div>
    </div>

    <div class="hud" id="mainHud">
        <h2 id="statusHeader" style="font-weight: 300; letter-spacing: 5px; color: #00d4ff;">STARK INDUSTRIES</h2>
        
        <div id="authSection">
            <p style="color: #444; font-size: 10px; letter-spacing: 2px;">NEURAL LINK AUTHORIZATION</p>
            <input type="password" id="passInput" maxlength="4" placeholder="****">
        </div>

        <div class="app-grid" id="appGrid">
            <!-- THE SECURE VAULT JUMP -->
            <div class="app-card" onclick="window.location.href='https://github.io'">
                <div class="app-icon">🎮</div><div class="app-label">Games</div>
            </div>
            
            <!-- STEALTH VIEWPORT LINKS -->
            <div class="app-card" onclick="launch('https://google.com')">
                <div class="app-icon">🔍</div><div class="app-label">Google</div>
            </div>
            
            <div class="app-card" onclick="launch('https://youtube.com')">
                <div class="app-icon">📺</div><div class="app-label">YouTube</div>
            </div>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('passInput');
        const appGrid = document.getElementById('appGrid');
        const authSection = document.getElementById('authSection');
        const viewport = document.getElementById('viewport');
        const frame = document.getElementById('frame');

        // EXIT PROTECTION
        window.onbeforeunload = () => "Neural Link will be severed.";

        // AUTHENTICATION (CODE: 3000)
        passInput.addEventListener('input', () => {
            if (passInput.value === "3000") {
                authSection.style.display = 'none';
                appGrid.style.display = 'grid';
                document.getElementById('statusHeader').innerText = "SYSTEM ACTIVE";
            }
        });

        // STEALTH LAUNCH (For internal sites)
        function launch(url) {
            frame.src = url;
            viewport.style.display = 'block';
            document.getElementById('mainHud').style.opacity = '0';
        }

        // EMERGENCY FLUSH
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") {
                frame.src = "";
                viewport.style.display = 'none';
                document.getElementById('mainHud').style.opacity = '1';
            }
        });
    </script>
</body>
</html>
