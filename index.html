<!DOCTYPE html>
<html>
<head>
    <title>Stark Industries - Neural Hub</title>
    <style>
        body { background-color: #010101; color: #00d4ff; font-family: 'Consolas', monospace; margin: 0; overflow: hidden; height: 100vh; }
        .hud { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        #gameWindow { display: none; width: 100vw; height: 100vh; border: none; background: #000; position: absolute; top: 0; left: 0; z-index: 999; }
        .menu-item { border: 1px solid #004455; padding: 15px; margin: 10px; cursor: pointer; width: 250px; transition: 0.3s; background: rgba(0,0,0,0.5); }
        .menu-item:hover { background: #00d4ff; color: #000; box-shadow: 0 0 15px #00d4ff; }
        #closeBtn { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(255,0,0,0.5); color: #fff; border: none; padding: 5px 10px; cursor: pointer; display: none; }
        input { background: transparent; border: 1px solid #00d4ff; color: #00d4ff; padding: 10px; text-align: center; font-family: inherit; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- THE GAME VIEWPORT (The Stealth Layer) -->
    <button id="closeBtn" onclick="closeGame()">X CLOSE SESSION [ESC]</button>
    <iframe id="gameWindow" src=""></iframe>

    <!-- THE HUD INTERFACE -->
    <div class="hud" id="mainHud">
        <h1 id="statusHeader" style="letter-spacing: 10px;">STARK INDUSTRIES</h1>
        
        <div id="authSection">
            <p>INPUT ACCESS CODE:</p>
            <input type="password" id="passInput" maxlength="4" placeholder="****">
        </div>

        <div id="hubMenu" style="display: none;">
            <p style="color: #004455; font-size: 12px; margin-bottom: 20px;">NEURAL LINK ESTABLISHED // SELECT INTEL</p>
            <div class="menu-item" onclick="launch('https://amazonaws.com')">DATA: FERN (S3 CLOAK)</div>
            <div class="menu-item" onclick="launch('https://githack.com')">DATA: 3KH0 CLOUD</div>
            <div class="menu-item" onclick="launch('https://google.com')">DATA: STEALTH GOOGLE</div>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('passInput');
        const gameWindow = document.getElementById('gameWindow');
        const closeBtn = document.getElementById('closeBtn');

        // --- AUTHENTICATION ---
        passInput.addEventListener('input', () => {
            if (passInput.value === "3000") {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('hubMenu').style.display = 'block';
                document.getElementById('statusHeader').innerText = "HUB ACTIVE";
            }
        });

        // --- THE STEALTH LAUNCH (iFrame Injection) ---
        function launch(url) {
            gameWindow.src = url;
            gameWindow.style.display = 'block';
            closeBtn.style.display = 'block';
        }

        function closeGame() {
            gameWindow.src = "";
            gameWindow.style.display = 'none';
            closeBtn.style.display = 'none';
        }

        // --- EMERGENCY FLUSH ---
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeGame();
        });
    </script>
</body>
</html>
