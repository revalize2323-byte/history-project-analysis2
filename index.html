<!DOCTYPE html>
<html>
<head>
    <title>Stark Industries - Authorization Required</title>
    <style>
        body { background-color: #020202; color: #00d4ff; font-family: 'Consolas', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .hud { border: 1px solid #004455; padding: 40px; text-align: center; border-radius: 10px; box-shadow: 0 0 20px #002233; min-width: 350px; }
        .bar-container { width: 100%; height: 4px; background: #111; margin: 25px auto; border-radius: 2px; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: linear-gradient(to right, #004455, #00d4ff); transition: width 0.3s; }
        input { background: transparent; border: 1px solid #004455; color: #00d4ff; padding: 10px; text-align: center; width: 80%; margin-top: 10px; font-family: inherit; }
        .menu-item { border: 1px solid #002233; padding: 10px; margin: 10px 0; cursor: pointer; display: none; transition: 0.3s; }
        .menu-item:hover { background: #004455; color: #fff; border-color: #00d4ff; }
    </style>
</head>
<body>
    <div class="hud" id="mainHud">
        <h2 id="headerText" style="letter-spacing: 5px;">STARK INDUSTRIES</h2>
        
        <!-- LOADING PHASE -->
        <div id="loadingSection">
            <div class="bar-container"><div id="bar"></div></div>
            <p id="status">AUTHORIZING NEURAL LINK...</p>
        </div>

        <!-- PASSWORD PHASE -->
        <div id="passwordSection" style="display: none;">
            <p>INPUT ACCESS CODE:</p>
            <input type="password" id="passInput" maxlength="4" placeholder="****">
        </div>

        <!-- HUB MENU PHASE -->
        <div id="hubSection" style="display: none;">
            <p style="font-size: 12px; color: #004455;">NEURAL HUB ACTIVE // SELECT DESTINATION</p>
            <div class="menu-item" onclick="jump('https://sites.google.com/site/unblockedwtf/')">GAMES: UNBLOCKED WTF</div>
            <div class="menu-item" onclick="jump('https://gx.games/')">GAMES: GX ARCADE</div>
            <div class="menu-item" onclick="jump('https://www.google.com')">TACTICAL: GOOGLE SEARCH</div>
            <p style="font-size: 8px; margin-top: 20px; color: #111;">ESC: EMERGENCY FLUSH</p>
        </div>
    </div>

    <script>
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');
        const passInput = document.getElementById('passInput');
        
        // --- PHASE 1: STARK LOADING ---
        let prog = 0;
        const load = setInterval(() => {
            prog += 2;
            bar.style.width = prog + '%';
            if (prog >= 100) {
                clearInterval(load);
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('passwordSection').style.display = 'block';
                passInput.focus();
            }
        }, 30);

        // --- PHASE 2: PASSWORD VERIFICATION ---
        passInput.addEventListener('input', () => {
            if (passInput.value === "3000") {
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('hubSection').style.display = 'block';
                document.getElementById('headerText').innerText = "HUB ACCESS GRANTED";
                // Reveal menu items with a delay
                const items = document.querySelectorAll('.menu-item');
                items.forEach((item, i) => {
                    setTimeout(() => { item.style.display = 'block'; }, i * 200);
                });
            }
        });

        // --- PHASE 3: THE JUMP ---
        function jump(url) {
            window.location.replace(url);
        }

        // --- EMERGENCY FLUSH ---
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") window.location.reload();
        });
    </script>
</body>
</html>
